server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Assets con hash: caché larga. Un archivo inexistente da 404 real (no index.html).
  location /komet/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA bajo /komet/
  location /komet/ {
    try_files $uri $uri/ /komet/index.html;
  }

  # Si el proxy (Traefik/Coolify) quita el prefijo /komet, también funciona.
  location / {
    try_files /komet$uri /komet$uri/ /komet/index.html;
  }
}
